# OTel Java Agent 설정 (우리 모듈 다섯 공통, Self-monitoring #213). 루트 Dockerfile 의 runtime 단계가 -Dotel.javaagent.configuration-file= 로 읽는다.
# 쇼핑몰(monimo-shop/otel/agent.properties)과 같은 내용에서 스레드 덤프 Extension 만 없다 : 우리 모듈은 자동 덤프 대상이 아니다.
# 에이전트 버전은 AGENT_VERSION 에 고정한다. 여기서 정한 값은 같은 이름의 환경변수(OTEL_*)로 덮어쓸 수 있다 (시스템 속성 > 환경변수 > 이 파일).
# 서비스 이름(otel.service.name)은 여기 적지 않는다. Dockerfile 의 target 단계가 OTEL_SERVICE_NAME 으로 넣는다 (monimo-api-server 등).
# Collector · Ingester 는 target 의 OTEL_TRACES_EXPORTER=none 이 아래 traces 줄을 덮는다 : 자기 스팬이 자기 입력으로 돌아오는 되먹임 때문

# 전송: OTLP gRPC → Collector. 컨테이너끼리 collector:4317 (공용 네트워크 monimo-dev)
otel.exporter.otlp.protocol=grpc
otel.exporter.otlp.endpoint=http://collector:4317
# Collector mTLS 를 require 로 올리면(#159 · ADR #64) 우리 모듈 다섯도 손님 신분증이 필요하다. 지금은 쇼핑몰 넷 것만 있다

# 3신호 전부 OTLP 로 보낸다
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp

# 샘플링은 에이전트가 하지 않는다. 100% 보내고 Collector 가 trace ID 해시로 고른다 (ADR #33)
otel.traces.sampler=always_on

# 겹친 CLIENT 스팬 접기(otel.instrumentation.experimental.span-suppression-strategy=span-kind)는 여기 두지 않는다 (#259).
# HTTP 로 말하는 DB 를 쓰는 모듈만 필요해서 루트 Dockerfile 의 api-server 단계에 뒀다 :
# ClickHouse 가 8123 에서 HTTP 로 말하고 clickhouse-jdbc 가 clickhouse-http-client 를 거쳐 httpclient5 를 쓰므로
# 조회 한 번에 CLIENT 스팬이 둘 생긴다(부모 DB · 자식 HTTP). Service map 이 호출 수를 2배로 세고 가짜 EXTERNAL 노드를 만든다.
# 다른 모듈은 PG(전용 프로토콜) · Kafka 라 겹치지 않는다.
# **Ingester 는 조건이 오면 바로 필요해진다** : ClickHouse 에 client-v2 로 쓰는데 HTTP 다. 지금은 OTEL_TRACES_EXPORTER=none
# (#213 되먹임) 이라 스팬이 안 나가서 안 보일 뿐이다. 그걸 켜게 되면 이 줄을 Ingester 단계에도 넣는다

# 로컬에서 화면에 빨리 보이게 지표 전송 주기를 줄인다 (기본 60초)
otel.metric.export.interval=10000

# 환경 표시. compose · K8s 가 OTEL_RESOURCE_ATTRIBUTES 로 이름표(service.instance.id)를 줄 때 이 값도 같이 적는다 (#30) : 환경변수는 이 줄을 통째로 바꾼다
otel.resource.attributes=deployment.environment.name=local
