name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: 빌드 + 테스트
        run: ./gradlew build

  docker-image:
    name: docker-image (${{ matrix.module }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [collector, ingester, api-server, detector, notifier]
    # 이 job 만 GitHub 에게 OIDC 증명서를 받아도 된다 (AWS 역할을 빌리는 데 쓴다, 저장해 둔 키는 없다)
    permissions:
      contents: read
      id-token: write
    env:
      # develop 에 머지됐을 때만 ECR 에 올린다 (#277). PR 은 지금처럼 만들기만 한다.
      # 레포 변수 AWS_ROLE_ARN 이 비어 있으면(AWS 쪽 역할이 아직 없으면) 올리기를 건너뛴다
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: 올리기를 건너뛴 이유 남기기
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AWS_ROLE_ARN == ''
        run: echo "::notice::레포 변수 AWS_ROLE_ARN 이 비어 있어 ECR 에 올리지 않는다 (#277)"
      - name: AWS 로그인 (GitHub OIDC 로 역할 빌리기)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: ECR 로그인
        if: env.PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: 이미지 만들기 (develop 머지면 ECR 에 커밋 SHA 태그로 올린다)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.module }}
          # 러너마다 이미지 하나라 그 모듈만 Gradle 로 만든다 (Dockerfile BOOT_JARS)
          build-args: BOOT_JARS=:${{ matrix.module }}:bootJar
          push: ${{ env.PUSH == 'true' }}
          # 태그는 커밋 SHA 하나만 : latest 는 ArgoCD 가 바뀐 것을 못 본다 (deploy docs/plan.md)
          tags: ${{ env.PUSH == 'true' && format('{0}/monimo/{1}:{2}', steps.ecr.outputs.registry, matrix.module, github.sha) || format('monimo/{0}:ci', matrix.module) }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  # ECR 에 올린 다섯 이미지의 태그를 deploy 레포에 커밋한다 (배포 5단계 뒤 절반, ADR #62 H).
  # Argo CD 는 레지스트리가 아니라 Git 만 본다 : 이 커밋이 생겨야 "새 버전이 나왔다" 를 안다.
  # 다섯이 전부 올라간 뒤에만 돈다(needs) : 하나라도 실패한 SHA 를 커밋하면 그 파드가 ImagePullBackOff 가 된다.
  # 쓰는 자격증명은 GitHub App 토큰(1시간 · deploy 레포 하나 · 레포 변수/시크릿). 개인 PAT · deploy key 는 쓰지 않는다
  deploy-tag:
    name: deploy-tag
    needs: docker-image
    # docker-image 가 실제로 올렸을 때만(AWS_ROLE_ARN) · App 이 준비됐을 때만(DEPLOY_APP_ID)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AWS_ROLE_ARN != '' && vars.DEPLOY_APP_ID != ''
    runs-on: ubuntu-latest
    # 머지 두 번이 거의 같이 끝나면 커밋이 엇갈린다 : 줄을 세워 하나씩 커밋한다 (취소하지 않는다 — 뒤의 것이 이긴다)
    concurrency:
      group: deploy-tag
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: GitHub App 토큰 (deploy 레포 하나만)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: monimo-deploy

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/monimo-deploy
          ref: develop
          token: ${{ steps.app-token.outputs.token }}
          path: deploy

      # 옛 실행을 Re-run 하면 deploy 레포가 그 옛 SHA 로 내려간다 (2026-11-23 실제로 났다 : #285).
      # 기준은 "develop 최신인가" 가 아니라 "지금 올라가 있는 것보다 새것인가" 다 :
      # 더 새 머지의 이미지 빌드가 실패해도 그 앞 것은 올라가야 하기 때문이다
      - name: 올라가 있는 SHA 보다 옛것이면 건너뛴다
        id: guard
        working-directory: deploy/overlays/eks/3-apps
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # 다섯 줄의 태그 중 SHA 꼴인 것만 (처음엔 태그가 없다) — 손으로 하나만 바꿨을 수도 있으니 전부 본다
          # yq 가 실패하면 여기서 job 이 멈춘다 : 검사가 고장 나서 조용히 통과하는 일이 없게 grep 과 나눠 둔다
          all=$(yq '.images[] | select(.name == "monimo-local.invalid/*") | .newTag // ""' kustomization.yaml)
          tags=$(grep -E '^[0-9a-f]{40}$' <<<"$all" | sort -u || true)
          for deployed in $tags; do
            [ "$deployed" = "$SHA" ] && continue
            status=$(gh api "repos/${REPO}/compare/${deployed}...${SHA}" --jq .status)
            echo "올라가 있는 ${deployed:0:7} 대비 이번 ${SHA:0:7} : ${status}"
            if [ "$status" != "ahead" ]; then
              echo "::notice::이번 ${SHA:0:7} 은 올라가 있는 ${deployed:0:7} 보다 새것이 아니다(${status}). 되돌리지 않으려고 커밋하지 않는다. 일부러 되돌리려면 deploy 레포에서 revert 한다"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: EKS overlay 의 이미지 줄을 이 커밋 SHA 로
        if: steps.guard.outputs.skip != 'true'
        working-directory: deploy/overlays/eks/3-apps
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          SHA: ${{ github.sha }}
        run: |
          # 계정 번호는 역할 ARN 에서 꺼낸다 (arn:aws:iam::<계정>:role/...) : 같은 값을 변수 두 곳에 두지 않는다
          account=$(cut -d: -f5 <<<"$ROLE_ARN")
          registry="${account}.dkr.ecr.ap-northeast-2.amazonaws.com"
          kustomize version
          for m in collector ingester api-server detector notifier; do
            kustomize edit set image "monimo-local.invalid/${m}=${registry}/monimo/${m}:${SHA}"
          done
          kustomize build . | grep -E '^\s+image: .*monimo/' || true

      - name: deploy 레포에 커밋
        if: steps.guard.outputs.skip != 'true'
        working-directory: deploy
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet; then
            echo "::notice::이미지 줄이 이미 ${SHA:0:7} 이다. 커밋하지 않는다"
            exit 0
          fi
          # 커밋 작성자를 App 봇으로 둔다 : 사람 이름이 아니라 "CI 가 바꿨다" 가 로그에 남는다
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "chore(images): backend ${SHA:0:7} 이미지 다섯 (eks)" -m "${RUN_URL}"
          # 다른 커밋이 먼저 들어왔으면 그 위로 다시 얹는다. 세 번까지
          for _ in 1 2 3; do
            git push origin HEAD:develop && exit 0
            git pull --rebase origin develop
          done
          echo "::error::deploy 레포 develop 에 세 번 다 못 올렸다"
          exit 1
