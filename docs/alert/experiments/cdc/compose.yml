# CDC 실험 전용 환경 (101-outbox-cdc.md). 팀 compose 와 따로 뜬다 : 프로젝트 monimo-cdc, 포트 25432 · 29092 · 28083
# 팀 PG 는 wal_level=replica 라 Debezium(논리 복제)을 붙일 수 없어 PG 도 따로 띄운다
name: monimo-cdc
services:
  pg:
    image: postgres:17.11-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    environment: { POSTGRES_USER: monimo, POSTGRES_PASSWORD: monimo, POSTGRES_DB: cdc }
    ports: ["25432:5432"]
    volumes: ["./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "monimo", "-d", "cdc"], interval: 2s, retries: 30 }
  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["29092:29092"]
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"], interval: 3s, retries: 40 }
  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    depends_on: { pg: { condition: service_healthy }, kafka: { condition: service_healthy } }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: cdc_configs
      OFFSET_STORAGE_TOPIC: cdc_offsets
      STATUS_STORAGE_TOPIC: cdc_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # 오프셋을 Kafka 에 남기는 주기. 이미지 기본값(60초) 그대로 — 갑자기 죽으면 이만큼 다시 보낼 수 있다
    ports: ["28083:8083"]
    healthcheck: { test: ["CMD-SHELL", "curl -fs localhost:8083/ >/dev/null"], interval: 3s, retries: 60 }
